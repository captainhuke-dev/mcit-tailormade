<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พิมพ์ภาพ SO</title>
<style>
  :root {
    --text: #172033;
    --muted: #64748b;
    --border: #dbe3ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f3f6fb; color: var(--text); font-family: "THSarabunNew", "Noto Sans Thai", sans-serif; }

  /* ---------- toolbar (ไม่ถูก print) ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: #0f172a;
    color: #fff;
  }
  .toolbar button {
    padding: 9px 16px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .toolbar button:hover { background: #1d4ed8; }
  .toolbar .toolbar-info { margin-left: auto; font-size: 13px; color: #cbd5e1; }

  /* ---------- A4 portrait — 1 ภาพ/หน้า (clone C# previewSOimage L149-173) ---------- */
  .img-page {
    width: 210mm;
    height: 297mm;
    margin: 16px auto;
    padding: 30px; /* C# A4 margin 30f */
    background: #fff;
    box-shadow: 0 2px 12px rgb(0 0 0 / 20%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    page-break-after: always;
  }
  .img-page:last-child { page-break-after: auto; }
  .img-page img {
    /* C# pic.ScaleAbsolute(530f, 770f) — A4 usable 530x770pt */
    max-width: 530px;
    max-height: 770px;
    object-fit: contain;
  }
  .img-page .img-caption {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  .img-page { position: relative; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none !important; }
    .img-page {
      margin: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.close()">✕ ปิด</button>
    <button type="button" onclick="window.print()">🖨 พิมพ์</button>
    <span class="toolbar-info" id="toolbarInfo">กำลังโหลด...</span>
  </div>

  <div id="pages"></div>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var vnos = params.get("vnos") || "";
  var connectionId = params.get("conn") || "c1788406814359"; // default MAC5
  var IMG_BASE = "../api/p059_image.php"; // proxied from FTP NAS (report/ → ../api/)

  function render(files) {
    var wrap = document.getElementById("pages");
    if (!files || files.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;padding:60px;color:#64748b">ไม่มีภาพสำหรับ ' + vnos + "</div>";
      document.getElementById("toolbarInfo").textContent = "ไม่มีภาพ";
      return;
    }
    var html = "";
    files.forEach(function (f, i) {
      html += '<div class="img-page">' +
        '<img src="' + IMG_BASE + "?f=" + encodeURIComponent(f) + '" alt="' + vnos + "_" + i + '" onerror="this.style.display=\'none\'">' +
        '<div class="img-caption">' + vnos + " (" + (i + 1) + "/" + files.length + ")</div>" +
        "</div>";
    });
    wrap.innerHTML = html;
    document.getElementById("toolbarInfo").textContent = vnos + " — " + files.length + " ภาพ";
  }

  fetch("../api/p059_detail.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ connectionId: connectionId, vnos: vnos })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (!data.ok) {
      document.getElementById("toolbarInfo").textContent = "Error: " + data.error;
      return;
    }
    render(data.files.map(function (f) { return f.filename; }));
  }).catch(function (e) {
    document.getElementById("toolbarInfo").textContent = "Error: " + e.message;
  });
})();
</script>
</body>
</html>
